<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Econexx Wealth Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
    overflow:hidden;
}

.logo-wrapper{
    position:relative;
    width:700px;
    max-width:90%;
}

.logo{
    width:100%;
    opacity:0;
    transform:scale(.8);
    animation:logoReveal 1.5s ease forwards;
}

.shine{
    position:absolute;
    top:0;
    left:-150%;
    width:60%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.8),
        transparent
    );
    transform:skewX(-25deg);
    animation:shine 2.5s ease 1.2s forwards;
}

@keyframes logoReveal{
    0%{
        opacity:0;
        transform:scale(.8);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes shine{
    0%{
        left:-150%;
    }
    100%{
        left:150%;
    }
}
</style>
</head>
